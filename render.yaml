services:
  - type: web
    name: dayo-app
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn Dayo_project.wsgi:application --timeout 180 --workers 1 --threads 2 --worker-class gthread
    envVars:
      # DATABASE_URL is set manually in the Render dashboard (Supabase pooler
      # connection string). sync:false keeps the blueprint from overwriting it.
      # The old Render `dayo-db` Postgres was removed after the free-plan expiry.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: NODE_VERSION
        value: "20.18.3"
